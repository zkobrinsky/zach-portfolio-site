<script type="text/javascript">
    // COLLECT ELEMENTS
    var jumbotronClicker = document.getElementById('clicker');
    var timer = null;
    const galleryTab = document.getElementById('gallery-tab');
    const videoTab = document.getElementById('video-tab');
    const galleryContainer = document.querySelector('.swiper-container');
    const videoContainer = document.getElementById('video-container');

    galleryTab.addEventListener('click', () => {
        galleryContainer.classList.remove('hidden');
        galleryTab.classList.add('active');
        videoTab.classList.remove('active');
        videoContainer.classList.add('hidden');

        JUMBOTRON.trackEvent(`clicked-gallery-tab`);
        window.JUMBOTRON.togglePlay();
    });

    videoTab.addEventListener('click', () => {
        galleryContainer.classList.add('hidden');
        videoTab.classList.add('active');
        galleryTab.classList.remove('active');
        videoContainer.classList.remove('hidden');
        JUMBOTRON.trackEvent(`clicked-video-tab`);
        window.JUMBOTRON.start();
    });
    

    // GLOBAL FUNCTIONS
    function clickToClient() {
        window.JUMBOTRON.clickThrough(click_tracker, 'ClickToClient');
        window.JUMBOTRON.mute();
    }

    // ASSIGN EVENTS
    jumbotronClicker.onclick = clickToClient;
    // logo.onclick = clickToClient;

    // fade in wrap
    window.addEventListener('load', function() {
        clearTimeout(timer);
        document.getElementById(options.wrapId).style.opacity = 1;
    });

    // just in case window load takes too long
    timer = window.setTimeout(function() {
        document.getElementById(options.wrapId).style.opacity = 1;
    }, 3000);

    // function toggleLogo(isDisplayed) {
    //     logo.hidden = !Boolean(isDisplayed);
    // }

</script>

<script type="text/javascript">
	// SWIPER
	const swiper = new Swiper('.swiper-container', {
	loop: true,
	centeredSlides: true,
	resistanceRatio: 0.2,
	navigation: {
		nextEl: '.swiper-button-next',
		prevEl: '.swiper-button-prev',
	},
    grabCursor: true
	});

	swiper.on('slideChangeTransitionEnd', function () {
		JUMBOTRON.trackEvent(`swiped to slide ${swiper.realIndex+1}`);
	});

	swiper.on('click', () => {
		JUMBOTRON.trackEvent(`clicked ${+swiper.clickedSlide.dataset.swiperSlideIndex+1}`);
		JUMBOTRON.clickThrough(click_tracker, 'ClickToClient');
	});
</script>
