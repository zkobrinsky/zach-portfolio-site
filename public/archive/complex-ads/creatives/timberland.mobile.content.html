<script type="text/javascript">
	// COLLECT ELEMENTS
	const superheroClicker = document.getElementById('clicker');
	const wrap = document.getElementById('wrap');
	const soundBtn = document.getElementById('sound-toggle');
	const videoContainer = document.getElementById('video-container');
	const cards = document.querySelectorAll('.card');
	
	// declare video background sources as strings ( used in setup() and resize()):
	const landscapeSrc = "https://media.complex.com/videos/2022-q1/timberland-boot-demo-01-2022/timberland-boot-demo-01-2022-bg-landscape_1280-15.mp4";
	const portraitSrc = "https://media.complex.com/videos/2022-q1/timberland-boot-demo-01-2022/timberland-boot-demo-01-2022-bg-portrait_1280-15.mp4";
	
	// setup video var
	let videoEl;

	if (options.isHeaderUnit === 'false') {
		if (options.isRos === 'true') {
			wrap.classList.add('ros');
		} else if (window.frameElement.parentNode.offsetWidth <= options.portraitBreakpoint) {
			wrap.classList.add('portrait');
		}
	}
	
	// ASSIGN EVENTS
	superheroClicker.onclick = function() {
		SUPERHERO.clickThrough(click_tracker, 'ClickToClient');
	};

	cards.forEach(card => {
		card.addEventListener('click', () => {
			SUPERHERO.clickThrough(click_tracker, 'Card_Clicked');
		})
	})

	var timer = null;
	// fade in wrap
	window.addEventListener('load', function() {
		clearTimeout(timer);
		document.getElementById(options.wrapId).style.opacity = 1;
	});

	// just in case window load takes too long
	timer = window.setTimeout(function() {
		document.getElementById(options.wrapId).style.opacity = 1;
	}, 3000);


	// CUSTOM ANIMATIONS AND FUNCTIONALITY:
	
	// sound toggle:
	

	soundBtn.addEventListener('click', () => {
		updateSound();
	});

	function updateSound() {
		if (videoEl.muted) {
			soundBtn.src="https://media.complex.com/campaigns/2022-q1/timberland-boot-demo-01-2022/superhero/img/sound-on.png"
		} else {
			soundBtn.src="https://media.complex.com/campaigns/2022-q1/timberland-boot-demo-01-2022/superhero/img/sound-off.png"
		}
		SUPERHERO.trackEvent(`sound_turned_${videoEl.muted ?  'on' : 'off'}`);
		videoEl.muted = !videoEl.muted;
	}

	// ANIMATION******************
	const master = gsap.timeline({
		paused:true,
		onComplete: handleTimelineComplete,
		// onStart: handleTimelineStart
    });

	function handleTimelineComplete() {
		// console.log('timeline completed');
		console.log(master.duration());
		// master.reverse();
	}

	function handleTimelineStart() {
		console.log('timeline started');
	}

	function setup() {
		let path;
		if (wrap.classList.contains('portrait')) {
			path = portraitSrc;
		} else {
			path = landscapeSrc;
		}
		videoContainer.innerHTML = `
		<video autoplay muted loop id="video-bg">
			<source src=${path} type="video/mp4">
		</video>
		`;
		videoEl = document.getElementById('video-bg');
	}

	// set up event listener for .portrait class:
	const mutationObserver = new MutationObserver(callback);

	mutationObserver.observe(
		document.getElementById('wrap'),
		{ attributes: true }
	);

	let currentClass = "";
	function callback(mutationsList) {
		mutationsList.forEach(mutation => {
			if (mutation.attributeName === 'class') {
				if (mutation.target.classList.value !== currentClass) {
					swapVideo(mutation.target.classList.value);
					currentClass = mutation.target.classList.value
				}
			}
		})
	}

	function swapVideo(string) {
		if (string === "portrait") {
			videoEl.src = portraitSrc;
		} else {
			videoEl.src = landscapeSrc;
		}
	}

	function setupTimeline() {
		master.add(fadeInOrange());
		master.add("cards");
		master.add(fadeInCards(), ">");
		master.add(addTime());
		master.add(fadeOutCards(), ">");
		master.add(fadeInOrange().reverse())
		master.repeat(-1);
	}

	function playTimeline() {
		// updateSound();
		master.restart();
	}

	function fadeInOrange() {
		return gsap.timeline()
			.fromTo("#translucent-orange", {opacity: 0}, {duration: 0.5, ease: "power2.out", opacity: 1}, 3)
			.fromTo("#init-overlay", {opacity: 1}, {duration: 0.5, ease: "power2.out", opacity: 0}, "<")
			.fromTo("#after-init-overlay", {opacity: 0}, {duration: 0.5, ease: "power2.out", opacity: 1}, "<")
	}

	function fadeInCards() {
		return gsap.timeline()
			.fromTo(".card", {css:{scaleX:0.01, scaleY:0.01, opacity: 0}}, {css:{scaleX:1, scaleY:1, opacity: 1}, duration: 0.1, ease: "power2.out", stagger: 0.15})
	}

	function fadeOutCards() {
		return gsap.timeline()
			.fromTo(".card", {css:{scaleX:0.01, scaleY:0.01, opacity: 0}}, {css:{scaleX:1, scaleY:1, opacity: 1}, duration: 0.1, ease: "power2.out"}).reverse()
	}

	function addTime() {
		return gsap.timeline()
			.fromTo(".card", {}, {duration: 10})
	}

	setup();
	setupTimeline();	
</script>
