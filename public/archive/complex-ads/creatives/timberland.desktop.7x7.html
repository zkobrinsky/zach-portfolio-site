	#hoverbar {

		display: block;
		position: absolute;
		top: 0;
		right: 0;
		z-index: 5;
		overflow: hidden;
	}
	#hoverbar::before {
		content: "";
		width: 100%;
		height: 100%;
		position: absolute;
		top: 0;
		right: 0;
		transform: translateX(-100%);
		background:#000;
		transition: transform 0.2s linear;
	}
	#logo:hover ~ #hoverbar::before {
		transform: translateX(0);
		transition: transform 900ms linear; /* if you changed the panelDelay in options adjust this value. Should be about 100ms less than panelDelay */
		transition-delay: 0.05s; /* delayed so that it doesn't show up on mouse over when there is no cookie */
	}
	#hoverbar.filled {

	}

<script>
    var logo = document.getElementById('logo');
    logo.addEventListener('mouseover', MWD_TOOLBAR.showPanelTimeoutInit);
    logo.addEventListener('mouseout', MWD_TOOLBAR.showPanelTimeoutCancel);
    logo.addEventListener('click', function () {
        MWD_TOOLBAR.showPanelTimeoutCancel();//so that the panel does not open
        MWD_TOOLBAR.clickThrough(clickTracker);
    });

    window.top.addEventListener('message', function (event) {
        if (event.data == 'cmnunt_videoplayer_video_end') {
            try {
                window.top.CMNHELPERS.timeBasedRefresh.init();
            } catch (e) { }
        } else if (event.data == 'cmnunt_videoplayer_video_start') {
            try {
                window.top.CMNHELPERS.timeBasedRefresh.stop();
            } catch (e) { }
        }
    }, false);
</script>
