		// NO need to change values below
        isHeaderUnit:   (
            window.frameElement.parentNode.parentNode.getAttribute('data-cmnunt-ad-size') === '3x3' ||

            ) ? 'true' : 'false',
        // is this an ROS (if yes sizes will be limited and won't switch to portrait)
        isRos:          ('Takeover'.toLowerCase() === 'ros' || 'Takeover'.toLowerCase() === 'branded content') ? 'true' : 'false',
		wrapId:         'wrap' // this is the outermost div in the unit. If you change this make sure to also make a change in CSS
	};

	var unit_kind = '';
    // restrict autoplay to inline units only
	if (options.isHeaderUnit === 'false') {
		unit_kind = 'Inline';

		options.onInview = function() {
            // wait for player to be ready
            var wait = setInterval(function() {
                if (window.player) {
                    window.postMessage('play', '*');
                    clearInterval(wait);
                }
            }, 50);
            // returning true to the onInview callback will unbind the
            // scroll listener after it has executed
            return true;
        }
	} else {
		unit_kind = 'Header';
	}

	// CAMPAIGN SETUP
	var campaign_name    =    'apple-tv-swagger-10-2021',

</script>

<script type="text/javascript">
	// COLLECT ELEMENTS
	var superheroClicker = document.getElementById('clicker');
	var wrap = document.getElementById('wrap');

	if (options.isHeaderUnit === 'false') {
		if (options.isRos === 'true') {
			wrap.classList.add('ros');
		} else if (window.frameElement.parentNode.offsetWidth <= options.portraitBreakpoint) {
			wrap.classList.add('portrait');
		}
	}
	
    var videoFilePath = 'https://media.complex.com/videos/2021-q4/apple-tv-swagger-10-2021/' +
                        'apple-tv-swagger-10-2021-1280x720-30-lq.mp4';
    var videoID = 'Generic';
	
	
		// INITIALIZE VIDEO PLAYER
		window.MWD_PLAYER.init({
        videoID: videoID,
        videoFilePath: videoFilePath,
        posterFilePath: 'https://media.complex.com/campaigns/2021-q4/apple-tv-swagger-10-2021/video.jpg',
        campaignName: campaign_name,
        unitType: unit_type,
        containerSelector: '#video_player'
        // autoplay: 'false',
        // controls: 'true', // accepts 'true', 'false', 'custom'
        // defaultVolume: 0.5,
        // animatedPosterDirection: 'topLeft', // accepts 'topLeft', 'topRight', 'bottomLeft', 'bottomRight', 'none'
        // progressbar: {
        //     strokeWidth: 5,
        //     easing: 'linear',
        //     duration: 2000,
        //     color: '#03A9F4',
        //     trailColor: '#FFF',
        //     trailWidth: 5,
        //     svgStyle: null
        // },
        // gaTracking: [
        //     '25%', '50%', '75%' // the string syntax should be either '%' or 's'
        // ],
        // debug: 'false', // set to 'true' if you want to debug google analytics events on console
    });

	document.getElementById('left_curtain_action').onclick = function() {
		window.postMessage('play', '*');
		document.getElementById('video').style.display = 'block';
	}
	document.getElementById('right_curtain_action').onclick = function() {
		SUPERHERO.clickThrough(click_tracker, 'ClickToClient-CurtainIcon');
	}
	document.getElementById('click_out').onclick = function() {
		SUPERHERO.clickThrough(click_tracker, 'ClickToClient-VideoIcon');
		window.postMessage('mute', '*');
	}
	window.addEventListener('message', function(event) {
		if (event.data == 'cmnunt_videoplayer_video_end') {
			var wrap = document.getElementById(options.wrapId);

			if (wrap.classList.contains('ros')) {
				document.getElementById('video').style.display = 'none';
			}

            try {
				window.top.CMNHELPERS.timeBasedRefresh.init();
			} catch(e) {}
		} else if (event.data == 'cmnunt_videoplayer_video_start'){
            try {
                window.top.CMNHELPERS.timeBasedRefresh.stop();
            } catch(e) {}

			document.getElementById('click_out').style.display = 'block';
		}
	}, false);
	
	// ASSIGN EVENTS
	superheroClicker.onclick = function() {
		SUPERHERO.clickThrough(click_tracker, 'ClickToClient');
	};

	var timer = null;
	// fade in wrap
	window.addEventListener('load', function() {
		clearTimeout(timer);
		document.getElementById(options.wrapId).style.opacity = 1;
	});

	// just in case window load takes too long
	timer = window.setTimeout(function() {
		document.getElementById(options.wrapId).style.opacity = 1;
	}, 3000);
	
</script>
