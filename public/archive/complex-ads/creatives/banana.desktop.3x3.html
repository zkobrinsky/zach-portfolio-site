<script type="text/javascript">

		// maxRosInlineWidth:          740, // max inline unit size when ROS (ROS is always landscape)

		// NO need to change values below
        isHeaderUnit:   (
            window.frameElement.parentNode.parentNode.getAttribute('data-cmnunt-ad-size') === '3x3' ||

        isRos:          ('ROS'.toLowerCase() === 'ros' || 'ROS'.toLowerCase() === 'branded content') ? 'true' : 'false',
		wrapId:         'wrap' // this is the outermost div in the unit. If you change this make sure to also make a change in CSS

	var unit_kind = '';

	if (options.isHeaderUnit === 'false') {
		unit_kind = 'Inline';

		options.onInview = function() {
            // wait for player to be ready
            var wait = setInterval(function() {
                if (window.player) {
                    window.postMessage('play', '*');
                    clearInterval(wait);
                }
            }, 50);
            // returning true to the onInview callback will unbind the
            // scroll listener after it has executed
            return true;
        }
	} else {
		unit_kind = 'Header';
	}

	// CAMPAIGN SETUP
	var campaign_name    =    'banana-republic-fall-harlem-fashion-09-2021',

</script>

<script type="text/javascript" src="https://media.complex.com/common/units/superhero/superhero.min.js"></script>
<script type="text/javascript">
	// SWIPER
	const swiper = new Swiper('.swiper-container', {
  loop: true,
  grabCursor: true,
  autoplay: {
	delay: 1,
	disableOnInteraction: true,
  },
  speed: 5000,
  freeMode: false,
  slidesPerView: 3.8,
  spaceBetween: 10
});

const swiperWrapper = document.querySelector('.swiper-wrapper');

swiper.on('slideChangeTransitionEnd', () => {
    SUPERHERO.trackEvent(`swiped to slide ${swiper.realIndex+1}`);
});

swiper.on('click', () => {
	SUPERHERO.trackEvent(`clicked ${+swiper.clickedSlide.dataset.swiperSlideIndex+1}`);
	SUPERHERO.clickThrough(click_tracker, 'ClickToClient');
});

let interacted = false;
let timeOut;

function manualScroll() {
	if (!interacted) {
		swiper.params.speed = 300;
		swiper.update();
		interacted = true;
	}
}

function autoScroll() {
	interacted = false;
	swiper.params.speed = 5000;
	swiper.autoplay.start();
	swiper.update();
}
swiper.on('touchEnd', e => {
	manualScroll();
	clearTimeout(timeOut);
	timeOut = setTimeout(autoScroll, 2000);
})
</script>
