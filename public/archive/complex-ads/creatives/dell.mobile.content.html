<script type="text/javascript">
	// COLLECT ELEMENTS
	var superheroClicker = document.getElementById('clicker');
	var wrap = document.getElementById('wrap');

	if (options.isHeaderUnit === 'false') {
		if (options.isRos === 'true') {
			wrap.classList.add('ros');
		} else if (window.frameElement.parentNode.offsetWidth <= options.portraitBreakpoint) {
			wrap.classList.add('portrait');
		}
	}
	
	// ASSIGN EVENTS
	superheroClicker.onclick = function() {
		SUPERHERO.clickThrough(click_tracker, 'ClickToClient');
	};

	var timer = null;
	// fade in wrap
	window.addEventListener('load', function() {
		clearTimeout(timer);
		document.getElementById(options.wrapId).style.opacity = 1;
	});

	// just in case window load takes too long
	timer = window.setTimeout(function() {
		document.getElementById(options.wrapId).style.opacity = 1;
	}, 3000);
	
</script>

<script type="text/javascript" src="https://media.complex.com/common/units/superhero/superhero.min.js"></script>

<script type="text/javascript">
	// SWIPER
const swiper = new Swiper('.swiper-container', {
  loop: true,
  grabCursor: true,
  slidesPerView: 1,
  spaceBetween: 0,
  navigation: {
    nextEl: '.swiper-button-next',
    prevEl: '.swiper-button-prev',
  },
});

swiper.on('slideChangeTransitionEnd', () => {
    SUPERHERO.trackEvent(`swiped to slide ${swiper.realIndex+1}`);
});

swiper.on('click', () => {
	SUPERHERO.trackEvent(`clicked ${+swiper.clickedSlide.dataset.swiperSlideIndex+1}`);
	SUPERHERO.clickThrough(click_tracker, 'ClickToClient');
});

</script>
