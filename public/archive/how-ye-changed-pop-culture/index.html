/* *******************************
************ STARS ************
******************************* */

body {
    min-height: 100vh;
}

.stars-container {
    position: fixed;
    background: black;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: -100;
}

.stars-background {
    transform-origin: center;
}

.star {
    position: absolute;
    display: inline-block;
    width: 5px;
    height: 5px;
    background-color: white;
    border-radius: 100px;
}

/* reduces concentration of stars on mobile */
@media (max-width: 920px) {
    .stars-container div:nth-child(3n+3) {
        display: none;
    }
}
</style>



<script>
    const container = document.querySelector('body');    

    // stars container
    let starsContainer = null;
    let background = null;
    let middleground = null;
    let foreground = null;

    // stars
    const starsArray = [];

    function createStars(numStars) {
        for (let i = 0; i < numStars; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.opacity = `${random(0.7, 0.9)}`;
            star.style.transform = `translate(${Math.random() * container.clientWidth}px, ${Math.random() * container.clientHeight}px)`;
            starsArray.push(star);

        }
        return starsArray;
    }

    function addStarsToDom(starsArray, container) {
        starsContainer = document.createElement('div');
        starsContainer.classList.add('stars-container');

        background = document.createElement('div');
        middleground = document.createElement('div');
        foreground = document.createElement('div');

        background.classList.add('stars-background');
        middleground.classList.add('stars-middleground');
        foreground.classList.add('stars-foreground');

        starsContainer.appendChild(background);
        starsContainer.appendChild(middleground);
        starsContainer.appendChild(foreground);

        for (let i = 0; i < starsArray.length; i++) {
            const star = starsArray[i];
            if (i % 1 === 0 ) {
                background.appendChild(star);
                star.style.width = `${random(2, 5)}px`;
                star.style.height = `${random(2, 5)}px`;
            }
            if (i % 2 === 0 ) {
                middleground.appendChild(star);
                star.style.width = `${random(4, 7)}px`;
                star.style.height = `${random(4, 7)}px`;
            }
            if (i % 3 === 0 ) {
                foreground.appendChild(star);
                star.style.width = `${random(5, 8)}px`;
                star.style.height = `${random(5, 8)}px`;
            }
        };
        container.appendChild(starsContainer);
    }

    addStarsToDom(createStars(1000), container);

    function random(min, max) {
        return min + Math.random() * (max - min);
    };

    window.addEventListener('resize', () => {
        starsArray.forEach(star => {
            star.style.transform = `translate(${Math.random() * container.clientWidth}px, ${Math.random() * container.clientHeight}px)`;
        });
    });

    // Parallax effect threshold - lower number is more extreme:
    const threshold = 60;

    document.addEventListener('mousemove', e => {
        const x = e.clientX-(container.clientWidth/2);
        const y = e.clientY-(container.clientHeight/2)
        background.style.transform = `translate(${x/threshold*0.3}px, ${y/threshold*0.3}px`;
        middleground.style.transform = `translate(${x/threshold*0.6}px, ${y/threshold*0.6}px`;
        foreground.style.transform = `translate(${x/threshold}px, ${y/threshold}px`;
    });
